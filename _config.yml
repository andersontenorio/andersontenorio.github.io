# Site configuration

theme: jekyll-theme-chirpy
lang: en
timezone: America/Recife

title: Anderson Tenório
tagline: Random stuff
description: >-
  Just another ship in the space.
url: "https://andersontenorio.github.io"

github:
  username: andersontenorio

twitter:
  username: andersontenorio

social:
  name: Anderson Tenório Sergio
  email: anderson.sergio@gmail.com
  links:
    - https://twitter.com/andersontenorio
    - https://github.com/andersontenorio
    - https://www.linkedin.com/in/andersontenorios

webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

analytics:
  google:
    id:

pageviews:
  provider:

theme_mode: dark
cdn:
avatar: /assets/img/sample/avatar.jpg
social_preview_image:
toc: true

comments:
  provider: disqus
  disqus:
    shortname: andersontenorio

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    # Keep offline caching disabled so returning visitors always receive the
    # current GitHub Pages deployment instead of a stale service-worker copy.
    enabled: false
    deny_paths:

paginate: 10
baseurl: ""

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - README.md
  - LICENSE

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
